<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcana Tabuleiro</title>
<meta name="description" content="Tabuleiro virtual para jogar D&D com os amigos: mapa, grade, tokens, régua e ping ao vivo.">
<meta name="theme-color" content="#111914">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css?v=1.0">
</head>
<body>

<!-- Tela inicial: escolher entre mestre e jogador -->
<main id="inicio" class="inicio">
  <div class="inicio-topo">
    <h1>Arcana Tabuleiro</h1>
    <p>Mapa, grade e tokens ao vivo para a sua mesa de D&amp;D. Sem conta: o mestre cria a sala e passa o código.</p>
  </div>
  <div class="inicio-cartoes">
    <section class="cartao">
      <h2>Sou o mestre</h2>
      <p>Prepare as cenas e abra a sala. Ela fica no ar enquanto esta página estiver aberta.</p>
      <button id="btn-mestre" class="btn primario">Abrir minha sala</button>
      <p id="mestre-info" class="dica"></p>
    </section>
    <section class="cartao">
      <h2>Sou jogador</h2>
      <form id="form-jogador">
        <label>Seu nome<input id="j-nome" maxlength="40" required autocomplete="nickname"></label>
        <label>Código da sala<input id="j-codigo" maxlength="6" required autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <div class="campo-cor"><span class="rotulo">Sua cor</span><div id="j-cores" class="cores"></div></div>
        <button class="btn primario" type="submit">Entrar na mesa</button>
      </form>
    </section>
  </div>
</main>

<!-- Tela do tabuleiro (mestre e jogador) -->
<div id="mesa" class="mesa" hidden>
  <header class="barra">
    <strong class="marca">Arcana Tabuleiro</strong>
    <span id="versao" class="versao"></span>
    <button id="chip-codigo" class="chip" type="button" title="Copiar o código"></button>
    <span id="status" class="status"><i></i><span></span></span>
    <span class="espaco"></span>
    <button id="btn-painel" class="btn pequeno so-celular" type="button" aria-expanded="false">Painel</button>
    <button id="btn-sair" class="btn pequeno" type="button">Sair</button>
  </header>

  <nav class="ferramentas" aria-label="Ferramentas">
    <button data-ferramenta="mover" class="ativo" title="Mover e selecionar (V)" aria-label="Mover">
      <svg viewBox="0 0 24 24"><path d="M12 2l3 3h-2v6h6V9l3 3-3 3v-2h-6v6h2l-3 3-3-3h2v-6H5v2l-3-3 3-3v2h6V5H9z"/></svg></button>
    <button data-ferramenta="regua" title="Régua (R)" aria-label="Régua">
      <svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
    <button data-ferramenta="laser" title="Bolinha com rastro: segure e mexa o mouse para apontar algo a todos (L)" aria-label="Bolinha com rastro">
      <svg viewBox="0 0 24 24"><circle cx="17" cy="7" r="3.2"/><path d="M3 21c3-1 5-3 7-6s4-5 5.5-6.2" fill="none" stroke-width="2.2" stroke-linecap="round" opacity=".55"/></svg></button>
    <button data-ferramenta="ping" title="Ping: mostrar um ponto a todos (P ou Shift+clique)" aria-label="Ping">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" fill="none"/></svg></button>
    <button data-ferramenta="grade" class="so-mestre" title="Medir um quadrado do mapa para ajustar a grade (G)" aria-label="Ajustar grade">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" fill="none"/></svg></button>
    <button data-ferramenta="nevoa" class="so-mestre" title="Névoa de guerra: revelar ou esconder partes do mapa (N)" aria-label="Névoa de guerra">
      <svg viewBox="0 0 24 24"><path d="M4 9h11a3 3 0 1 0-3-3M3 13h16a3 3 0 1 1-3 3M5 17h7" fill="none" stroke-linecap="round"/></svg></button>
    <button data-ferramenta="paredes" class="so-mestre" title="Paredes, portas e luzes: visão dinâmica (W)" aria-label="Paredes, portas e luzes">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 12h18M9 5v7M15 12v7" fill="none"/></svg></button>
    <button data-ferramenta="terreno" class="so-mestre" title="Terreno difícil: pinte quadrados que custam o dobro para andar (T)" aria-label="Terreno difícil">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z" fill="none"/><path d="M3 13L13 3M3 21L21 3M11 21l10-10" fill="none"/></svg></button>
    <button data-ferramenta="desenho" title="Desenho livre no mapa (D)" aria-label="Desenho livre">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" fill="none" stroke-linejoin="round"/></svg></button>
    <button data-ferramenta="molde" title="Molde de magia: esfera, cone, linha, cubo (M)" aria-label="Molde de magia">
      <svg viewBox="0 0 24 24"><path d="M3 12L20 4v16z" fill="none" stroke-linejoin="round"/><circle cx="3" cy="12" r="1.6"/></svg></button>
    <button id="btn-3d" title="Dados 3D" aria-label="Ligar ou desligar os dados 3D" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" fill="none"/><path d="M12 2.5v6.2M3.8 7.25l8.2 1.45 8.2-1.45M12 8.7l-5 8.6h10z" fill="none"/></svg></button>
    <button id="btn-dados" class="so-celular" title="Rolagens" aria-label="Abrir rolagens">
      <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="none"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="9" r="1.3"/><circle cx="16" cy="15" r="1.3"/></svg></button>
    <button id="btn-enquadrar" title="Ver o mapa inteiro (F)" aria-label="Ver o mapa inteiro">
      <svg viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none"/></svg></button>
  </nav>

  <div class="palco">
    <canvas id="tela" aria-label="Tabuleiro"></canvas>
    <div id="aviso-mapa" class="aviso-mapa" hidden></div>
    <div id="aviso-iniciativa" class="aviso-iniciativa" hidden role="alert"></div>
    <div id="opcoes-nevoa" class="opcoes-nevoa" hidden></div>
    <div id="opcoes-paredes" class="opcoes-nevoa" hidden></div>
    <div id="opcoes-desenho" class="opcoes-nevoa" hidden></div>
    <div id="opcoes-molde" class="opcoes-nevoa" hidden></div>
    <div id="dica-ferramenta" class="dica-ferramenta" hidden></div>
    <div id="dados3d" class="dados3d-canto" aria-live="polite"></div>
    <section id="rolagens" class="rolagens" aria-label="Rolagens"></section>
  </div>

  <aside id="painel" class="painel" aria-label="Painel"></aside>
</div>

<div id="vitrine" class="vitrine" hidden role="dialog" aria-modal="true" aria-labelledby="vitrine-nome">
  <figure><img id="vitrine-img" alt=""><figcaption id="vitrine-nome"></figcaption></figure>
  <button id="vitrine-fechar" class="btn primario" type="button">Fechar</button>
</div>

<div id="dado" class="dado" hidden></div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal-caixa">
    <header><h2 id="modal-titulo"></h2><button id="modal-fechar" class="btn pequeno" type="button">Fechar</button></header>
    <div id="modal-corpo" class="modal-corpo"></div>
  </div>
</div>

<div id="avisos" class="avisos" role="status" aria-live="polite"></div>

<script src="vendor/peerjs-1.5.4.min.js?v=1.0"></script>
<script type="module" src="js/app.js?v=1.0"></script>
</body>
</html>
